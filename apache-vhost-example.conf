# Copy the VirtualHost block into C:/xampp/apache/conf/extra/httpd-vhosts.conf
<VirtualHost *:80>
    ServerName itbooks.local
    DocumentRoot "C:/xampp/htdocs/IT-Books/public"
    <Directory "C:/xampp/htdocs/IT-Books/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/itbooks-error.log"
    CustomLog "logs/itbooks-access.log" common
</VirtualHost>
